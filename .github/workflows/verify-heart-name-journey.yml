name: Verify real named Violet Heart visitor journey
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-heart-name-journey.yml'
      - 'tests/headtts-journey.test.mjs'
      - 'site/violet-voice.mjs'
      - 'site/violet-dynamic-name.mjs'
      - 'site/experience.mjs'
      - 'site/opening-state.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-named-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium with WebGL
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Observe actual named speech, mouth poses and presentation continuation
        run: node tests/headtts-journey.test.mjs
      - name: Save actual visual/audio observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-heart-named-journey
          path: artifacts/violet-name-real-journey.*
          if-no-files-found: ignore
