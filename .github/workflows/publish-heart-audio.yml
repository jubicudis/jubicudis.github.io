name: Publish approved Revision 2 Heart narration on main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-heart-audio.yml'
      - 'site/opening-script.mjs'
      - 'tools/generate_approved_opening.py'
  workflow_dispatch:
concurrency:
  group: publish-heart-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-heart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read approved script from its single owning source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {OPENING_TRACKS} from './site/opening-script.mjs';
          if(OPENING_TRACKS['asking-name'].length!==4 ||
             OPENING_TRACKS['after-name'].length!==17)
            throw new Error('Approved Revision 2 source unexpected');
          fs.writeFileSync('/tmp/revision2-text.json',JSON.stringify(OPENING_TRACKS));
          NODE
      - name: Install free offline synthesis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check 'kokoro-onnx==0.6.1' 'soundfile==0.13.1'
      - name: Download licensed Kokoro model
        run: |
          curl -fLsS --retry 3 -o /tmp/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -fLsS --retry 3 -o /tmp/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s /tmp/kokoro-v1.0.onnx)" -gt 200000000
          test "$(stat -c%s /tmp/voices-v1.0.bin)" -gt 20000000
      - name: Generate and qualify actual Heart recordings
        run: |
          mkdir -p site/audio
          python tools/generate_approved_opening.py --model /tmp/kokoro-v1.0.onnx --voices /tmp/voices-v1.0.bin --source /tmp/revision2-text.json --output /tmp/heart-generated
          for track in asking-name after-name; do
            # Mild cartoon-character lift: +8% pitch with compensating tempo
            # correction, retaining Heart's identity and approximate timing.
            # This is a candidate character treatment, not a new speaker.
            ffmpeg -hide_banner -nostdin -loglevel error -y -i "/tmp/heart-generated/violet-heart-$track.wav" \
              -af "asetrate=24000*1.08,aresample=24000,atempo=0.925925926" \
              -c:a libmp3lame -q:a 2 "site/audio/violet-heart-$track.mp3"
            test "$(stat -c%s "site/audio/violet-heart-$track.mp3")" -gt 10000
            ffprobe -v error -show_entries format=duration -of default=nw=1 "site/audio/violet-heart-$track.mp3"
          done
          # The decoded, encoded MP3 is authoritative. Keep the cue boundaries
          # aligned with the exact media committed in this SAME transaction.
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          path=Path('site/audio/heart-timeline.json')
          generated=Path('/tmp/heart-generated/heart-timeline.json')
          data=json.loads(generated.read_text())
          for name,track in data['tracks'].items():
              media=f'site/audio/violet-heart-{name}.mp3'
              duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',media],text=True).strip())*1000
              original=track['durationMs']
              if abs(duration-original)>max(100,original*.012):
                  raise RuntimeError(f'Heart audio and synthesized cue timeline diverged: {name} {original} {duration}')
              ratio=duration/original
              for cue in track['cues']:
                  cue['startMs']=round(cue['startMs']*ratio)
                  cue['endMs']=round(cue['endMs']*ratio)
              track['durationMs']=round(duration)
              track['cues'][-1]['endMs']=track['durationMs']
          path.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          # Cut the approved after-name recording at its measured welcome
          # boundary and generate its exact continuation in the same job.
          CUT_MS=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('site/audio/heart-timeline.json')).tracks['after-name'].cues[0].endMs)")
          CUT_SECONDS=$(awk "BEGIN {printf \"%.3f\", $CUT_MS/1000}")
          ffmpeg -hide_banner -nostdin -loglevel error -y -ss "$CUT_SECONDS" \
            -i site/audio/violet-heart-after-name.mp3 -map 0:a:0 \
            -c:a libmp3lame -q:a 2 site/audio/violet-heart-post-welcome.mp3
          sha256sum site/audio/violet-heart-post-welcome.mp3 > site/audio/heart-continuation-sha256.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path('site/audio')
          t=json.loads((base/'heart-timeline.json').read_text())['tracks']['after-name']['cues']
          source=base/'violet-heart-after-name.mp3'
          output=base/'violet-heart-post-welcome.mp3'
          data=dict(sourceVoice='af_heart',source=str(source),
                    sourceSha256=hashlib.sha256(source.read_bytes()).hexdigest(),
                    output=str(output),outputSha256=hashlib.sha256(output.read_bytes()).hexdigest(),
                    cutFromObservedTimelineMs=t[0]['endMs'],
                    firstOrientationCueInSourceMs=t[1]['startMs'],
                    purpose='Continue exact approved orientation after the observed personalized Heart welcome')
          (base/'heart-continuation-provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          # Derive the acoustic envelope from these exact MP3 bytes before
          # committing. A mismatched envelope can never be published.
          for track in asking-name after-name post-welcome; do
            ffmpeg -hide_banner -nostdin -loglevel error -y \
              -i "site/audio/violet-heart-$track.mp3" -ar 8000 -ac 1 \
              -acodec pcm_s16le "/tmp/heart-envelope-$track.wav"
          done
          python tools/generate_heart_envelope.py
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('site/audio')
          timeline=json.loads((base/'heart-timeline.json').read_text())
          envelope=json.loads((base/'heart-envelope.json').read_text())
          for name,track in timeline['tracks'].items():
              observed=envelope['tracks'][name]['durationMs']
              if abs(observed-track['durationMs'])>80:
                  raise RuntimeError(f'Heart audio duration mismatch {name}: {observed} != {track["durationMs"]}')
          PY
          cp /tmp/heart-generated/heart-provenance.json site/audio/heart-provenance.json
          sha256sum site/audio/violet-heart-asking-name.mp3 site/audio/violet-heart-after-name.mp3 > site/audio/heart-sha256.txt
          # Superseded voice file is no longer an active presentation asset.
          # Existing AAC assets remain until all consumers are verified on MP3.
          git rm -f --ignore-unmatch site/audio/violet-heart-welcome.m4a
      - name: Commit newly synthesized Heart character-treatment audio directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/audio/heart-provenance.json site/audio/heart-timeline.json site/audio/heart-sha256.txt site/audio/heart-envelope.json site/audio/violet-heart-asking-name.mp3 site/audio/violet-heart-after-name.mp3 site/audio/violet-heart-post-welcome.mp3 site/audio/heart-continuation-sha256.txt site/audio/heart-continuation-provenance.json
          if ! git diff --cached --quiet; then
            git fetch origin main
            git reset --soft origin/main
            git commit -m "Publish synchronized approved Heart media and measurements"
            git push origin HEAD:main
          fi
