name: Verify real on-device HeadTTS Heart name synthesis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-heart-name.yml'
      - 'tests/headtts-browser.test.mjs'
      - 'site/violet-dynamic-name.mjs'
      - 'site/experience.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-name:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual browser TTS test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Observe real Heart named audio and facial poses in the website
        run: |
          mkdir -p artifacts
          node tests/headtts-browser.test.mjs
      - name: Save actual playback and viseme observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-headtts-real-named-flow
          path: artifacts/heart-named-flow-observed.json
          if-no-files-found: ignore
      - name: Save rendered named presentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-headtts-real-named-screenshot
          path: artifacts/violet-real-heart-named-orientation.png
          if-no-files-found: ignore
