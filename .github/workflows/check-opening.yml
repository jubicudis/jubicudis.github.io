name: Verify Violet opening
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check state transitions
        run: node --test tests/state.test.mjs tests/appearance.test.mjs tests/voice.test.mjs tests/capabilities.test.mjs tests/selected-voice.test.mjs tests/dynamic-name.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the real opening in Chromium
        run: node tests/browser.test.mjs
      - name: Preserve rendered screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-opening-rendered
          path: artifacts/
          if-no-files-found: ignore
