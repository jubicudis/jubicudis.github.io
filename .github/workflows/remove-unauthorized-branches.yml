name: Remove unauthorized development branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-unauthorized-branches.yml']
permissions:
  contents: write
jobs:
  remove-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the ten unauthorized branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'complete-paper-grounded-presentation-20261105'
            'diagnose-live-browser-20261105'
            'fix-live-responsive-loading-20261105'
            'fix-violet-copilot-20261105'
            'fix-violet-ime-composition'
            'site-foundation'
            'source-grounded-state-study'
            'spatial-rebuild'
            'verify-live-completed-presentation-20261105'
            'violet-spatial-rebuild'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting unauthorized branch $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
      - name: Verify only main remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          refs="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          echo "$refs"
          test "$refs" = 'main'
