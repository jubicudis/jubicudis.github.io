name: Violet voice auditions (free Kokoro)
on:
  # Auditions are preserved as an explicit free capability, but Heart
  # is already approved. Refrain from auto-synthesizing unselected voices.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract actual source-approved opening lines
        run: |
          mkdir -p auditions .voice-model
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {OPENING_TRACKS} from './site/opening-script.mjs';
          const greeting=OPENING_TRACKS['asking-name'].map(x=>x.text).join(' ');
          const welcome=OPENING_TRACKS['after-name'].slice(0,3).map(x=>x.text).join(' ');
          if (!greeting || !welcome) throw new Error('Authoritative opening text unavailable');
          fs.writeFileSync('auditions/script.json',JSON.stringify({greeting,welcome},null,2));
          NODE
      - name: Install free offline synthesis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng
          python -m pip install --disable-pip-version-check 'kokoro-onnx==0.6.1' 'soundfile==0.13.1'
      - name: Obtain official open-weight Kokoro model and voice library
        run: |
          curl --fail --location --retry 3 --connect-timeout 30 \
            --output .voice-model/kokoro-v1.0.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl --fail --location --retry 3 --connect-timeout 30 \
            --output .voice-model/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s .voice-model/kokoro-v1.0.onnx)" -gt 200000000
          test "$(stat -c%s .voice-model/voices-v1.0.bin)" -gt 20000000
          sha256sum .voice-model/* > auditions/model-file-sha256.txt
      - name: Generate natural-pitch female voice auditions
        run: |
          python tools/generate_voice_auditions.py \
            --model .voice-model/kokoro-v1.0.onnx \
            --voices .voice-model/voices-v1.0.bin \
            --script auditions/script.json --output auditions
      - name: Preserve actual WAV samples and quality metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: violet-female-voice-auditions
          path: auditions/
          retention-days: 30
          if-no-files-found: warn
