#DCE5EE" stroke-width="1.5" width="388" x="113" y="735" /><rect fill="#007E79" height="43" rx="12" ry="12" stroke="#007E79" stroke-width="0" width="43" x="129" y="752" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0" text-anchor="middle" x="150.5" y="782">9</text><text fill="#1B2939" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0" text-anchor="start" x="183" y="782">Metacognition</text><text fill="#526478" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start" x="137" y="820">Evaluation, learning</text><text fill="#526478" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start" x="137" y="845">and feedback</text><rect fill="#FFFFFF" height="137" rx="14" ry="14" stroke="#DCE5EE" stroke-width="1.5" width="388" x="566" y="735" /><rect fill="#007E79" height="43" rx="12" ry="12" stroke="#007E79" stroke-width="0" width="43" x="582" y="752" /><text fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0" text-anchor="middle" x="603.5" y="782">8</text><text fill="#1B2939" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0" text-anchor="start" x="636" y="782">Reality</text><text fill="#526478" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start" x="590" y="820">Relates observation</text><text fill="#526478" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start" x="590" y="845">and admitted events</text><rect fill="#FFFFFF" height="137" rx="14" ry="14" stroke="#DCE5EE" stroke-width="1.5" width="388" x="1019" y="735" /><rect fill="#007E79" height="43" rx="12" ry="12" stroke="#007E79" stroke-width="0" width="43" x="10