d" stroke-linejoin="round" stroke-width="3.5" /><polygon fill="#007E79" points="109.0,614.0 100.47475477940495,619.2268722893066 100.47475477940495,608.7731277106934" /><text fill="#526478" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start" x="157" y="909">Admitted external events may also enter at Stage 8; cognition does not require a new request.</text><text fill="#526478" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start" x="64" y="971">Architectural sequence • targeted implementations and tests exist; complete native end-to-end execution is not verified</text></svg>