<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1010px" version="1.1" viewBox="0 0 1600 1010" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7FAFD" height="1010" rx="0" ry="0" stroke="none" stroke-width="1" width="1600" x="0" y="0" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" x="62" y="84">FROM MACHINE METRICS TO COMPUTATION</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="63" y="128">TNOS design: two reference frames, related through TranquilSpeak and mathematics</text><rect fill="#E7F6F3" height="39" rx="20" ry="20" stroke="#C4E5E0" stroke-width="1" width="238" x="1302" y="52" /><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" x="1421" y="79">DESIGN STUDY</text><rect fill="#FFFFFF" height="567" rx="21" ry="21" stroke="#D5E0EB" stroke-width="2" width="642" x="60" y="200" /><rect fill="#1F5FA3" height="9" rx="4" ry="4" stroke="none" stroke-width="1" width="642" x="60" y="200" /><rect fill="#FFFFFF" height="567" rx="21" ry="21" stroke="#D5E0EB" stroke-width="2" width="624" x="916" y="200" /><rect fill="#6D4FA9" height="9" rx="4" ry="4" stroke="none" stroke-width="1" width="624" x="916" y="200" /><text fill="#1F5FA3" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="91" y="259">FRAME 01  /  PHYSICAL MACHINE</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="91" y="296">Machine hardware and its changing conditions</text><rect fill="#F2F7FD" height="318" rx="14" ry="14" stroke="none" stroke-width="1" width="579" x="91" y="321" /><text fill="#1F5FA3" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="117" y="362">ACQUISITION + METRIC COLLECTION</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="117" y="397">Operating measurements, where available:</text><rect fill="#EAF3FD" height="59" rx="11" ry="11" stroke="none" stroke-width="1" width="530" x="114" y="414" /><circle cx="136" cy="443.5" fill="#1F5FA3" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="158" y="451.64">Processor, clock and device activity</text><rect fill="#EAF3FD" height="59" rx="11" ry="11" stroke="none" stroke-width="1" width="530" x="114" y="485" /><circle cx="136" cy="514.5" fill="#1F5FA3" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="158" y="522.64">Memory, resources and system load</text><rect fill="#EAF3FD" height="59" rx="11" ry="11" stroke="none" stroke-width="1" width="530" x="114" y="556" /><circle cx="136" cy="585.5" fill="#1F5FA3" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="158" y="593.64">Energy and power-related conditions</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="100" y="688">Establish source, availability and observed state.</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="100" y="718">A measurement is not automatically its meaning.</text><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="810" y="325">TRANQUILSPEAK</text><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" x="810" y="358">+ MATHEMATICS</text><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="810" y="407">Contextual</text><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="810" y="437">interpretation</text><line stroke="#00817C" stroke-linecap="round" stroke-width="5" x1="718" x2="904" y1="482" y2="482" /><polygon fill="#00817C" points="904,482 889,473.3 889,490.7" /><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="810" y="531">Relationship</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" x="810" y="558">between frames</text><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="810" y="603">NOT A</text><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" x="810" y="627">THIRD FRAME</text><text fill="#6D4FA9" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="945" y="259">FRAME 02  /  COMPUTING RUNTIME</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="945" y="296">Computational state in relation to the machine</text><rect fill="#F0EBF9" height="76" rx="11" ry="11" stroke="none" stroke-width="1" width="565" x="945" y="345" /><circle cx="967" cy="383.0" fill="#6D4FA9" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" x="989" y="391.51">Interpreted and grounded state</text><rect fill="#F0EBF9" height="76" rx="11" ry="11" stroke="none" stroke-width="1" width="565" x="945" y="439" /><circle cx="967" cy="477.0" fill="#6D4FA9" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="989" y="485.14">Identity and contextual computation</text><rect fill="#F0EBF9" height="76" rx="11" ry="11" stroke="none" stroke-width="1" width="565" x="945" y="533" /><circle cx="967" cy="571.0" fill="#6D4FA9" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" x="989" y="578.77">Thought, action, observation, feedback</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="954" y="670">Subsequent operations depend on established</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start" x="954" y="699">information and relevant mathematical context.</text><rect fill="#EAF0F6" height="135" rx="17" ry="17" stroke="#DCE5ED" stroke-width="1" width="1480" x="60" y="795" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="800" y="842">ONE UNDERLYING COMPUTATIONAL SYSTEM</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" x="800" y="879">Changing physical conditions can inform later computation through new measurements.</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="800" y="910">Measured electrical energy is not interchangeable with every contextual “energy” variable.</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" x="64" y="978">Architecture and design intent only  •  Complete native-to-cognition execution not verified</text></svg>