<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1890px" version="1.1" viewBox="0 0 760 1890" width="760px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F7FAFD" height="1890" rx="0" ry="0" stroke="none" stroke-width="1" width="760" x="0" y="0" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" x="38" y="80">FROM MACHINE METRICS</text><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start" x="38" y="137">TO COMPUTATION</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="40" y="182">TNOS design · two reference frames</text><rect fill="#E7F6F3" height="42" rx="21" ry="21" stroke="#C4E5E0" stroke-width="1" width="230" x="40" y="207" /><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="155" y="235">DESIGN STUDY</text><rect fill="#FFFFFF" height="591" rx="20" ry="20" stroke="#D5E0EB" stroke-width="2" width="688" x="36" y="283" /><rect fill="#1F5FA3" height="9" rx="4" ry="4" stroke="none" stroke-width="1" width="688" x="36" y="283" /><text fill="#1F5FA3" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" x="65" y="345">FRAME 01  /  PHYSICAL MACHINE</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="65" y="384">Hardware and changing conditions</text><rect fill="#F2F7FD" height="357" rx="13" ry="13" stroke="none" stroke-width="1" width="637" x="62" y="413" /><text fill="#1F5FA3" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" x="84" y="462">ACQUISITION + METRIC COLLECTION</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="84" y="503">Measurements when available:</text><rect fill="#EAF3FD" height="65" rx="11" ry="11" stroke="none" stroke-width="1" width="604" x="79" y="526" /><circle cx="101" cy="558.5" fill="#1F5FA3" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="123" y="568.49">Processor, clock, device activity</text><rect fill="#EAF3FD" height="65" rx="11" ry="11" stroke="none" stroke-width="1" width="604" x="79" y="604" /><circle cx="101" cy="636.5" fill="#1F5FA3" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="123" y="646.49">Memory, resources, system load</text><rect fill="#EAF3FD" height="65" rx="11" ry="11" stroke="none" stroke-width="1" width="604" x="79" y="682" /><circle cx="101" cy="714.5" fill="#1F5FA3" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="123" y="724.49">Energy and power conditions</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="68" y="818">Establish measurement source and availability.</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="68" y="854">Not just a list of hardware components.</text><line stroke="#00817C" stroke-linecap="round" stroke-width="5" x1="380" x2="380" y1="894" y2="963" /><polygon fill="#00817C" points="380,963 371.3,948 388.7,948" /><text fill="#00817C" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle" x="380" y="1002">TranquilSpeak + mathematics</text><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" x="380" y="1046">Interpret measured state in context</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" x="380" y="1082">Relationship—not a third reference frame</text><line stroke="#00817C" stroke-linecap="round" stroke-width="5" x1="380" x2="380" y1="1094" y2="1163" /><polygon fill="#00817C" points="380,1163 371.3,1148 388.7,1148" /><rect fill="#FFFFFF" height="458" rx="20" ry="20" stroke="#D5E0EB" stroke-width="2" width="688" x="36" y="1180" /><rect fill="#6D4FA9" height="9" rx="4" ry="4" stroke="none" stroke-width="1" width="688" x="36" y="1180" /><text fill="#6D4FA9" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" x="65" y="1242">FRAME 02  /  COMPUTING RUNTIME</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="65" y="1283">State-dependent computation</text><rect fill="#F0EBF9" height="74" rx="11" ry="11" stroke="none" stroke-width="1" width="625" x="65" y="1310" /><circle cx="87" cy="1347.0" fill="#6D4FA9" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="109" y="1356.99">Interpreted and grounded state</text><rect fill="#F0EBF9" height="74" rx="11" ry="11" stroke="none" stroke-width="1" width="625" x="65" y="1399" /><circle cx="87" cy="1436.0" fill="#6D4FA9" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="109" y="1445.25">Identity and contextual computation</text><rect fill="#F0EBF9" height="74" rx="11" ry="11" stroke="none" stroke-width="1" width="625" x="65" y="1488" /><circle cx="87" cy="1525.0" fill="#6D4FA9" r="6" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="109" y="1533.88">Thought, action, observation, feedback</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="68" y="1609">Later results depend on established state.</text><rect fill="#EAF0F6" height="174" rx="15" ry="15" stroke="#DCE5ED" stroke-width="1" width="688" x="36" y="1664" /><text fill="#192B3E" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="380" y="1711">ONE UNDERLYING SYSTEM</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="380" y="1754">New measurements inform later computation.</text><text fill="#53677D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="middle" x="380" y="1797">Design intent; full end-to-end path unverified.</text></svg>