<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" data-mode="rest">
<defs>
  <filter id="bloom" x="-70%" y="-100%" width="240%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  <linearGradient id="lumen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaff"/><stop offset=".55" stop-color="#f2d7ff"/><stop offset="1" stop-color="#dda6ff"/></linearGradient>
</defs>
<style>
  #eye-smile,#eye-open,#eye-blink,#mouth-smile,#mouth-speak{display:none}
  svg[data-mode="rest"] #eye-smile,svg[data-mode="talk"] #eye-smile{display:inline}
  svg[data-mode="ask"] #eye-open{display:inline}
  svg[data-mode="blink"] #eye-blink{display:inline}
  svg[data-mode="rest"] #mouth-smile,svg[data-mode="ask"] #mouth-smile,svg[data-mode="blink"] #mouth-smile{display:inline}
  svg[data-mode="talk"] #mouth-speak{display:inline}
  .illuminated{stroke:url(#lumen);stroke-linecap:round;stroke-linejoin:round;fill:none}
  .glow{stroke:#c77cff;stroke-width:26;opacity:.7;filter:url(#bloom)}
</style>
<g id="eye-smile">
  <g class="illuminated glow"><path d="M165 216 Q219 149 273 215"/><path d="M367 215 Q421 149 475 216"/></g>
  <g class="illuminated" stroke-width="17"><path d="M165 216 Q219 149 273 215"/><path d="M367 215 Q421 149 475 216"/></g>
</g>
<g id="eye-open">
  <g fill="#e0a4ff" opacity=".55" filter="url(#bloom)"><ellipse cx="219" cy="209" rx="31" ry="43"/><ellipse cx="421" cy="209" rx="31" ry="43"/></g>
  <g fill="url(#lumen)"><ellipse cx="219" cy="209" rx="19" ry="32"/><ellipse cx="421" cy="209" rx="19" ry="32"/></g>
  <g fill="#7753a5"><ellipse cx="221" cy="219" rx="7" ry="15"/><ellipse cx="423" cy="219" rx="7" ry="15"/></g>
  <g fill="#fff"><circle cx="214" cy="197" r="5"/><circle cx="416" cy="197" r="5"/></g>
</g>
<g id="eye-blink" stroke="url(#lumen)" stroke-width="12" stroke-linecap="round"><path d="M193 216 Q220 222 248 216"/><path d="M393 216 Q420 222 448 216"/></g>
<g id="mouth-smile">
  <path d="M272 291 C295 300 345 301 368 290 C363 320 341 342 320 342 C298 341 278 324 272 291Z" fill="#d59afc" opacity=".6" filter="url(#bloom)"/>
  <path d="M272 291 C295 300 345 301 368 290 C363 320 341 342 320 342 C298 341 278 324 272 291Z" fill="url(#lumen)"/>
</g>
<g id="mouth-speak">
  <ellipse cx="320" cy="303" rx="30" ry="32" fill="#dba4ff" opacity=".7" filter="url(#bloom)"/>
  <path d="M284 287 Q320 264 356 287 Q357 325 320 336 Q284 326 284 287Z" fill="#dca8ff"/>
  <path d="M292 290 Q320 278 348 290 Q349 311 320 322 Q291 311 292 290Z" fill="#4b1b73"/>
  <path d="M301 311 Q320 309 339 311 Q331 322 320 323 Q308 321 301 311Z" fill="#ffdcff"/>
</g>
</svg>